<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fresita · 西语闪卡</title><style>:root{--pink:#d94d79;--light:#fff0f4;--ink:#48343e}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff5f7,#fffdf8);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.wrap{max-width:680px;margin:auto;padding:22px 18px 60px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:29px;margin:12px 0 4px}small,.muted{color:#927d86}.pill{border-radius:30px;background:#ffe1eb;padding:9px 14px;font-size:13px}.panel{background:white;border:1px solid #f8d9e2;box-shadow:0 12px 35px #e6a6ba22;border-radius:24px;padding:23px;margin-top:18px}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tabs button,.btn{border:0;border-radius:14px;padding:12px 15px;background:#f8e9ef;color:#6b4c58;font-weight:650;cursor:pointer}.tabs button.active,.btn.primary{background:var(--pink);color:white}.btn:disabled{opacity:.5}.word{font-size:38px;font-weight:750;margin:28px 0 20px;text-align:center}.label{text-align:center;color:#a48090;font-size:14px}.center{text-align:center}.input{width:100%;border:2px solid #f3d4df;border-radius:14px;padding:15px;font-size:21px;outline:none;margin:15px 0}.input:focus{border-color:var(--pink)}.feedback{border-radius:16px;padding:15px;background:#fff0f4;margin-top:13px;line-height:1.65}.success{background:#eaf8ee}.progress{height:9px;background:#f9e1e9;border-radius:10px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#df7798;transition:width .3s}.stat{display:flex;justify-content:space-around;text-align:center}.stat strong{display:block;font-size:24px;color:#b8416c}.card{min-height:240px;border-radius:22px;background:linear-gradient(140deg,#ffe1eb,#fff6e7);display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer;padding:22px}.card .word{margin:10px 0}.hide{display:none!important}select{border:1px solid #efccd9;border-radius:10px;padding:10px;background:white;color:var(--ink)}.hint{font-size:13px;line-height:1.6;color:#907783;margin-top:13px}.list{margin-top:14px;display:grid;gap:8px}.item{background:#fff7f9;padding:11px 13px;border-radius:12px;display:flex;justify-content:space-between;gap:10px}.item button{border:0;background:transparent;color:var(--pink);font-weight:700}.footer{margin-top:22px;font-size:12px;color:#9a8690;text-align:center}button:focus-visible{outline:3px solid #f7a1ba}</style></head><body><div class="wrap"><header><div><h1>🍓 Fresita</h1><small>一点点进步，也值得庆祝 · Español A1</small></div><span class="pill">20 个基础词</span></header><div class="panel"><div class="row tabs"><button id="tabQuiz" class="active" onclick="mode('quiz')">✍️ 混合默写</button><button id="tabCards" onclick="mode('cards')">🃏 翻面闪卡</button><button id="tabWrong" onclick="mode('wrong')">💗 错词本</button></div><div class="stat" style="margin-top:22px"><div><strong id="attempts">0</strong><small>练习次数</small></div><div><strong id="accuracy">—</strong><small>正确率</small></div><div><strong id="wrongCount">0</strong><small>待巩固词</small></div></div></div><div id="quiz" class="panel"><div class="row" style="justify-content:space-between"><span class="pill" id="kind">中文 → 西语</span><label class="muted">范围 <select id="scope" onchange="next()"><option value="all">全部单词</option><option value="wrong">仅错词</option></select></label></div><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><div class="label" id="questionLabel">请默写西班牙语</div><div id="question" class="word">音乐</div><div class="center"><button class="btn" onclick="speak()">🔊 播放西语发音</button> <button class="btn" onclick="slowSpeak()">🐢 慢速</button></div><input id="answer" class="input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="在这里输入西语…" onkeydown="if(event.key==='Enter')checkOrNext()"><div class="row"><button class="btn primary" id="check" onclick="checkOrNext()">检查拼写 ✓</button><button class="btn" onclick="reveal()">显示答案</button><button class="btn" onclick="next()">跳过 →</button></div><div id="feedback" class="feedback hide"></div><div class="hint">听写模式会隐藏西语拼写；请先听声音再输入。浏览器语音需要设备支持西班牙语声音。答案会检查冠词和重音符号。</div></div><div id="cards" class="panel hide"><div class="label">点击卡片翻面</div><div id="flashcard" class="card" onclick="flip()"><div class="label" id="cardSide">中文</div><div class="word" id="cardText">音乐</div><div class="muted" id="cardExtra">点击查看答案</div></div><div class="row" style="margin-top:15px"><button class="btn" onclick="cardStep(-1)">← 上一张</button><button class="btn" onclick="flip()">翻面</button><button class="btn" onclick="cardStep(1)">下一张 →</button><button class="btn" onclick="cardSpeak()">🔊 发音</button></div><p class="muted center" id="cardNum"></p></div><div id="wrong" class="panel hide"><h2>💗 我的错词本</h2><p class="muted">答错或主动查看答案的词会进入这里。答对两次后自动移出。</p><div id="wrongList" class="list"></div><div class="row" style="margin-top:18px"><button class="btn primary" onclick="practiceWrong()">练习错词</button><button class="btn" onclick="resetStats()">清空学习记录</button></div></div><div class="footer">数据仅保存在当前浏览器 · 不需要登录 · 离线可用（发音取决于设备）</div></div><script>
const words=[['音乐','la música','Siempre escucho música.'],['星期三','el miércoles','Hoy es miércoles.'],['树','el árbol','El árbol es grande.'],['城市','la ciudad','Vivo en una ciudad.'],['语言','el idioma','Estudio un idioma.'],['学习','estudiar','Quiero estudiar español.'],['工作','trabajar','Quiero trabajar aquí.'],['旅行','viajar','Me gusta viajar.'],['朋友','el amigo / la amiga','Mi amiga es simpática.'],['家庭','la familia','Mi familia es grande.'],['食物','la comida','La comida está rica.'],['水','el agua','Bebo agua.'],['早晨','la mañana','Por la mañana estudio.'],['晚上','la noche','Buenas noches.'],['漂亮的','bonito / bonita','Es una casa bonita.'],['困难的','difícil','El español es difícil.'],['有趣的','interesante','Es muy interesante.'],['永远；总是','siempre','Siempre escucho música.'],['有时候','a veces','A veces estudio por la noche.'],['因为','porque','Estudio porque me gusta.']];
const key='fresita-spanish-v1';let data;try{data=JSON.parse(localStorage.getItem(key))||{attempts:0,correct:0,wrong:{}}}catch{data={attempts:0,correct:0,wrong:{}}};let current=0,kind='meaning',answered=false,cardIndex=0,flipped=false,last=-1,turn=0;function save(){try{localStorage.setItem(key,JSON.stringify(data))}catch(e){}stats()}function stats(){document.getElementById('attempts').textContent=data.attempts;document.getElementById('accuracy').textContent=data.attempts?Math.round(100*data.correct/data.attempts)+'%':'—';document.getElementById('wrongCount').textContent=Object.keys(data.wrong).length;document.getElementById('bar').style.width=(data.attempts%20)*5+'%'}function normalize(s){return s.trim().toLocaleLowerCase('es').replace(/\s+/g,' ')}function acceptable(i){let a=words[i][1];if(i===8)return ['el amigo','la amiga'];if(i===14)return ['bonito','bonita'];return [a]}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function speakText(t,rate=0.9){if(!('speechSynthesis'in window)){alert('当前浏览器不支持语音朗读');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=rate;let vs=speechSynthesis.getVoices();let v=vs.find(v=>v.lang.toLowerCase().startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}function speak(){speakText(acceptable(current)[0])}function slowSpeak(){speakText(acceptable(current)[0],0.65)}function pick(){let ids=words.map((_,i)=>i);if(document.getElementById('scope').value==='wrong'){ids=ids.filter(i=>data.wrong[i]);if(!ids.length){document.getElementById('scope').value='all';ids=words.map((_,i)=>i);alert('错词本目前是空的，先练全部单词吧！')}}let priority=ids.filter(i=>data.wrong[i]);if(priority.length&&Math.random()<.55)ids=priority;let options=ids.filter(i=>i!==last);if(!options.length)options=ids;return options[Math.floor(Math.random()*options.length)]}function next(){current=pick();last=current;answered=false;turn++;kind=turn%2?'meaning':'audio';document.getElementById('kind').textContent=kind==='meaning'?'📖 中文 → 西语':'🎧 听音 → 拼写';document.getElementById('questionLabel').textContent=kind==='meaning'?'请根据中文默写西语':'请听发音，默写西语';document.getElementById('question').textContent=kind==='meaning'?words[current][0]:'🎧 ?';document.getElementById('answer').value='';document.getElementById('feedback').classList.add('hide');document.getElementById('check').textContent='检查拼写 ✓';try{document.getElementById('answer').focus()}catch(e){}}function diff(a,b){let A=Array.from(a),B=Array.from(b),n=A.length,m=B.length,d=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)d[i][0]=i;for(let j=0;j<=m;j++)d[0][j]=j;for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(A[i-1]===B[j-1]?0:1));return d[n][m]}function markWrong(){data.wrong[current]=Math.max(0,data.wrong[current]||0)+2}function checkOrNext(){if(answered){next();return}let typed=normalize(document.getElementById('answer').value);if(!typed){document.getElementById('answer').focus();return}let options=acceptable(current),ok=options.some(a=>normalize(a)===typed);data.attempts++;if(ok){data.correct++;if(data.wrong[current]){data.wrong[current]--;if(data.wrong[current]<=0)delete data.wrong[current]}}else markWrong();save();answered=true;document.getElementById('check').textContent='下一题 →';let box=document.getElementById('feedback');box.classList.remove('hide');box.classList.toggle('success',ok);let canonical=words[current][1];let hint='';if(!ok){let closest=options.slice().sort((a,b)=>diff(typed,normalize(a))-diff(typed,normalize(b)))[0];if(normalize(typed).normalize('NFD').replace(/[\u0300-\u036f]/g,'')===normalize(closest).normalize('NFD').replace(/[\u0300-\u036f]/g,''))hint='你只漏了重音符号，注意 á / é / í / ó / ú。';else if(typed.replace(/^(el|la) /,'')===normalize(closest).replace(/^(el|la) /,''))hint='单词主体对了，检查冠词 el / la。';else if(diff(typed,normalize(closest))<=2)hint='非常接近！检查一下有没有漏字母或把字母写错。';else hint='先观察正确拼写，再点下一题，之后还会复习它。'}box.innerHTML=(ok?'🎉 <b>¡Muy bien! 完全正确！</b>':'🌷 <b>再记一次就好！</b>')+'<br>正确答案：<b>'+escapeHtml(canonical)+'</b><br>'+escapeHtml(words[current][2])+(hint?'<br>'+escapeHtml(hint):'');if(kind==='audio')document.getElementById('question').textContent=words[current][0]}function reveal(){if(answered)return;markWrong();save();answered=true;document.getElementById('check').textContent='下一题 →';let b=document.getElementById('feedback');b.className='feedback';b.innerHTML='💡 正确答案：<b>'+escapeHtml(words[current][1])+'</b><br>'+escapeHtml(words[current][2])+'<br>已加入待巩固词。';if(kind==='audio')document.getElementById('question').textContent=words[current][0]}function mode(m){for(let id of ['quiz','cards','wrong']){document.getElementById(id).classList.toggle('hide',id!==m);document.getElementById('tab'+id[0].toUpperCase()+id.slice(1)).classList.toggle('active',id===m)}if(m==='wrong')renderWrong();if(m==='cards')renderCard()}function renderCard(){document.getElementById('cardSide').textContent=flipped?'西班牙语':'中文';document.getElementById('cardText').textContent=flipped?words[cardIndex][1]:words[cardIndex][0];document.getElementById('cardExtra').textContent=flipped?words[cardIndex][2]:'点击查看答案';document.getElementById('cardNum').textContent=(cardIndex+1)+' / '+words.length}function flip(){flipped=!flipped;renderCard()}function cardStep(d){cardIndex=(cardIndex+d+words.length)%words.length;flipped=false;renderCard()}function cardSpeak(){speakText(acceptable(cardIndex)[0])}function renderWrong(){let el=document.getElementById('wrongList');let ids=Object.keys(data.wrong).map(Number);el.innerHTML=ids.length?ids.map(i=>'<div class="item"><span>'+escapeHtml(words[i][0])+' · <b>'+escapeHtml(words[i][1])+'</b></span><button onclick="speakText(acceptable('+i+')[0])">🔊</button></div>').join(''):'🌱 还没有错词，继续保持！'}function practiceWrong(){document.getElementById('scope').value='wrong';mode('quiz');next()}function resetStats(){if(confirm('确定清空练习次数和错词记录吗？')){data={attempts:0,correct:0,wrong:{}};save();renderWrong()}}try{stats();next()}catch(e){document.getElementById('question').textContent='音乐';document.getElementById('questionLabel').textContent='请默写西班牙语';document.getElementById('kind').textContent='📖 中文 → 西语';} </script></body></html>
